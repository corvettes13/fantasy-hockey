<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Standings</title>

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/matchups.css" />
  <link rel="stylesheet" href="css/leaders.css" />  
</head>
<body>
  <div class="layout-shell">
    <div class="header-inner">
      <header class="site-header"></header>
    </div>

    <script>
      fetch('shared/header.html')
        .then(res => res.text())
        .then(html => {
          document.querySelector('.site-header').innerHTML = html;
        });
    </script>
    
    <main class="page-content">
      <div class="card standings-card">
        <div class="moduletabs navlist" style="margin-bottom: 15px; padding-bottom: 0; border-bottom: 1px solid #e2e8f0;">
          <ul class="Nav-h" style="border-bottom: none; margin-bottom: 5px;">
            <li id="tab-matchups" class="Navitem Selected">Matchups</li>
            <li id="tab-bracket" class="Navitem">Playoff Bracket</li>
          </ul>
        </div>

        <div id="view-matchups">
          <div class="week-selector">
            <span class="week-label"></span>
            <div class="week-controls">
              <button id="week-prev" class="week-arrow">←</button>
              <select id="week-select"></select>
              <button id="week-next" class="week-arrow">→</button>
            </div>
          </div>
          <h1 id="week-title">Week Matchups</h1>
          <div id="matchups-body"></div>
        </div>

        <div id="view-bracket" style="display: none;">
          <h1 style="margin-top: 10px;">Championship Bracket</h1>
          <div id="bracket-container" class="bracket-wrapper"></div>
        </div>
      </div>
    </main>
      
    <br>
      
      <!-- Standings Section -->
      <div class="card">
        <h1>Broom Ballers and Shot Callers Standings</h1>
        <div class="standings-controls">
          <select id="standings-select">
            <option value="2025_standings.json">Current Standings</option>
            <option value="2024_standings.json">2024–25 Standings</option>
            <option value="2023_standings.json">2023–24 Standings</option>
          </select>
        </div>

        <!-- Bruhs Division -->
        <section class="division-section">
          <h3>Bruhs</h3>
          <div class="table-wrapper">
            <table class="standings-table">
              <thead>
                <tr>
                  <th><button data-sort="rank">Rank</button></th>
                  <th class="left-align">Team</th>
                  <th><button data-sort="wins">W</button></th>
                  <th><button data-sort="losses">L</button></th>
                  <th><button data-sort="Win Percentage">Win %</button></th>
                  <th><button data-sort="points for">PF</button></th>
                  <th><button data-sort="points against">PA</button></th>
                  <th><button data-sort="difference">Diff</button></th>
                  <th><button data-sort="faab_balance">Waiver Bdgt</button></th>
                  <th><button data-sort="number_of_moves">Moves</button></th>
                  <th><button data-sort="weekly_high_score">High</button></th>
                </tr>
              </thead>
              <tbody id="bruhs-body"></tbody>
            </table>
          </div>
        </section>

        <!-- Bros Division -->
        <section class="division-section">
          <h3>Bros</h3>
          <div class="table-wrapper">
            <table class="standings-table">
              <thead>
                <tr>
                  <th><button data-sort="rank">Rank</button></th>
                  <th class="left-align">Team</th>
                  <th><button data-sort="wins">W</button></th>
                  <th><button data-sort="losses">L</button></th>
                  <th><button data-sort="Win Percentage">Win %</button></th>
                  <th><button data-sort="points for">PF</button></th>
                  <th><button data-sort="points against">PA</button></th>
                  <th><button data-sort="difference">Diff</button></th>
                  <th><button data-sort="faab_balance">Waiver Bdgt</button></th>
                  <th><button data-sort="number_of_moves">Moves</button></th>
                  <th><button data-sort="weekly_high_score">High</button></th>
                </tr>
              </thead>
              <tbody id="bros-body"></tbody>
            </table>
          </div>
        </section>
      </div>

      <!-- Fantasy Leaders Section -->
      <div class="card">
        <h1>Top Fantasy Performers (Previous Day)</h1>
        <div class="table-wrapper">
          <table id="embedded-players-table">
            <thead>
              <tr>
                <th>Player</th>
                <th>Owner</th>
                <th>Position</th>
                <th>Team</th>
                <th>Fantasy Points</th>
                <th>Stats</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      
      <link rel="stylesheet" href="css/transactions.css" />

      <div class="card">
        <h1>Recent League Activity</h1>
        <div class="table-wrapper">
          <table id="players-table" class="widget-table"> <tbody id="transactions-widget-body">
              </tbody>
          </table>
        </div>
        <div style="text-align: center; padding: 12px; border-top: 1px solid #eee;">
          <a href="players/transactions.html" style="font-size: 0.85rem; color: #0055a5; text-decoration: none; font-weight: bold;">View All League Transactions →</a>
        </div>
      </div>

    <script src="scripts/transactions_embed.js"></script>

    </main> <!-- end .index-container -->

    <script src="scripts/standings.js"></script>
    <script src="scripts/fantasy_leaders_embed.js"></script>
    <script src="scripts/matchups.js"></script>
    <script src="scripts/playoffs.js"></script>
  </div> <!-- end .page-shell -->
</body>
</html>
