<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Matchup View</title>
  <link rel="stylesheet" href="/fantasy-hockey/css/players.css" />
  <link rel="stylesheet" href="/fantasy-hockey/css/header.css" />
  <link rel="stylesheet" href="/fantasy-hockey/css/matchups.css" />
</head>

<body class="matchup-page">
  <div class="layout-shell">
    <div class="header-inner">
      <header class="site-header"></header>
    </div>

    <script>
      fetch('/fantasy-hockey/shared/header.html')
        .then(res => res.text())
        .then(html => {
          document.querySelector('.site-header').innerHTML = html;
        });
    </script>

    <div class="container">
      <div class="matchup-hero">
        <div class="team-block" id="team1-header">
          <img class="matchup-logo" id="team1-logo" src="" alt="">
          <div class="team-details">
            <div class="team-info-group">
              <h2 class="team-name-matchup" id="team1-name"></h2>
              <p class="team-manager" id="team1-manager"></p>
              <p class="team-meta" id="team1-meta"></p>
            </div>
          </div>
          <div class="score-container">
            <div class="matchup-score" id="team1-score">0.0</div>
              <div class="projection-details" id="team1-projections">
                  <div class="initial-proj"><span id="team1-init-proj">0.0</span></div>
                  <div class="new-proj" id="team1-new-proj-container">
                      <span id="team1-new-proj">0.0</span>
                  </div>
              </div>
          </div>
        </div>

        <div class="vs-divider">VS</div>

        <div class="team-block home-block" id="team2-header">
          <div class="score-container">
            <div class="matchup-score" id="team2-score">0.0</div>
              <div class="projection-details" id="team2-projections">
                  <div class="initial-proj"><span id="team2-init-proj">0.0</span></div>
                  <div class="new-proj" id="team2-new-proj-container">
                      <span id="team2-new-proj">0.0</span>
                  </div>
              </div>
          </div>
          <div class="team-details">
            <div class="team-info-group">
              <h2 class="team-name-matchup" id="team2-name"></h2>
              <p class="team-manager" id="team2-manager"></p>
              <p class="team-meta" id="team2-meta"></p>
            </div>
          </div>
          <img class="matchup-logo" id="team2-logo" src="" alt="">
        </div>
      </div>

      <div class="matchup-controls">
        <div class="moduletabs navlist">
          <ul class="Nav-h Nav-bordered-south" id="day-tabs">
          </ul>
        </div>
      </div>

      <div class="matchup-tables-container">
        
        <div class="matchup-column" id="team1-tables">
          <div class="table-wrapper">
            <div class="team-game-stats" id="team1-game-stats">
                <span class="stat-pill">Skaters: <strong id="team1-skater-gp">0</strong> Played | <strong id="team1-skater-rem">0</strong> Rem</span>
                <span class="stat-pill">Goalies: <strong id="team1-goalie-gp">0</strong> Played | <strong id="team1-goalie-rem">0</strong> Rem</span>
            </div>
            <table class="matchup-table left-align">
              <thead>
                <tr>
                  <th>Player</th>
                  <th>FP</th><th>G</th><th>A</th><th>PIM</th><th>SHG</th><th>GWG</th><th>SOG</th><th>BLK</th><th>HIT</th>
                </tr>
              </thead>
              <tbody id="team1-skaters-body"></tbody>
              <tfoot id="team1-skaters-footer" class="matchup-totals"></tfoot>
            </table>
          </div>

          <div class="matchup-section-divider"></div>

          <div class="table-wrapper">
            <table class="matchup-table left-align">
              <thead>
                <tr>
                  <th>Player</th>
                  <th>FP</th><th>GS</th><th>W</th><th>L</th><th>GA</th><th>SV</th><th>SV%</th><th>SHO</th>
                </tr>
              </thead>
              <tbody id="team1-goalies-body"></tbody>
              <tfoot id="team1-goalies-footer" class="matchup-totals"></tfoot>
            </table>
          </div>
        </div>

        <div class="matchup-column" id="team2-tables">
          <div class="table-wrapper">
            <div class="team-game-stats" id="team2-game-stats">
              <span class="stat-pill">Skaters: <strong id="team2-skater-gp">0</strong> Played | <strong id="team2-skater-rem">0</strong> Rem</span>
              <span class="stat-pill">Goalies: <strong id="team2-goalie-gp">0</strong> Played | <strong id="team2-goalie-rem">0</strong> Rem</span>
            </div>
            <table class="matchup-table left-align">
              <thead>
                <tr>
                  <th>Player</th>
                  <th>FP</th><th>G</th><th>A</th><th>PIM</th><th>SHG</th><th>GWG</th><th>SOG</th><th>BLK</th><th>HIT</th>
                </tr>
              </thead>
              <tbody id="team2-skaters-body"></tbody>
              <tfoot id="team2-skaters-footer" class="matchup-totals"></tfoot>
            </table>
          </div>
          
          <div class="matchup-section-divider"></div>

          <div class="table-wrapper">
            <table class="matchup-table left-align">
              <thead>
                <tr>
                  <th>Player</th>
                  <th>FP</th><th>GS</th><th>W</th><th>L</th><th>GA</th><th>SV</th><th>SV%</th><th>SHO</th>
                </tr>
              </thead>
              <tbody id="team2-goalies-body"></tbody>
              <tfoot id="team2-goalies-footer" class="matchup-totals"></tfoot>
            </table>
          </div>
        </div>

      </div> </div> </div>

  <script src="scripts/team-matchups.js"></script>
</body>
</html>
