<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>League Champions</title>
  <link rel="stylesheet" href="/fantasy-hockey/css/champions.css" />
  <link rel="stylesheet" href="/fantasy-hockey/css/header.css" />
  <link rel="stylesheet" href="/fantasy-hockey/css/styles.css" />
</head>
<body class="champions-page">
  <div class="layout-shell">
    <div class="header-inner">
      <header class="site-header"></header>
    </div>

    <script>
    fetch('/fantasy-hockey/shared/header.html')
      .then(res => res.text())
      .then(html => {
        document.querySelector('.site-header').innerHTML = html;
      });
    </script>

    <div class="container">
      <section class="latest-champion-card">
        <div class="hero-content">
          <img src="/fantasy-hockey/images/champion.png" alt="League Trophy" class="hero-trophy">
          <div class="hero-text">
            <p class="season-label">2025-26 CHAMPIONS</p>
            <h2 class="hero-team-name">The Hype Machine</h2>
            <p class="hero-manager">Manager: Bradford Neumann</p>
          </div>
          <img src="https://yahoofantasysports-res.cloudinary.com/image/upload/t_s192sq/fantasy-logos/87391dcde4363ccaaec4fd843d2a32d931f612b0dbf3deadd79e53c42ce004c3.png" alt="Team Logo" class="hero-team-logo">
        </div>
      </section>

      <div class="history-grid">
        <div class="history-section">
          <div class="section-header">
            <img src="/fantasy-hockey/images/champion.png" class="small-icon">
            <h2>Stanley Cup History</h2>
          </div>
          <table class="history-table">
            <thead>
              <tr>
                <th>Season</th>
                <th>Champion</th>
                <th>Runner-Up</th>
              </tr>
            </thead>
            <tbody id="champions-body">
              </tbody>
          </table>
        </div>

        <div class="history-section">
          <div class="section-header">
            <img src="/fantasy-hockey/images/presidentstrophy.png" class="small-icon">
            <h2>Presidents' Trophy</h2>
          </div>
          <table class="history-table">
            <thead>
              <tr>
                <th>Season</th>
                <th>Winner</th>
                <th>Record</th>
              </tr>
            </thead>
            <tbody id="presidents-body">
              </tbody>
          </table>
        </div>
      </div>

      <hr class="section-divider">
      <div class="history-section">
        <h2>Playoff Pool Champions</h2>
        <table id="playoff-table">
          </table>
      </div>
    </div>
  <script src="../scripts/champions.js"></script>
</body>
</html>
