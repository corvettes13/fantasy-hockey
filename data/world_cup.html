<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Olympic Bingo Card</title>

  <link rel="stylesheet" href="/fantasy-hockey/css/header.css" />
  <link rel="stylesheet" href="/fantasy-hockey/css/styles.css" />
  <link rel="stylesheet" href="/fantasy-hockey/css/bingo.css" />
</head>

<body>
  <div class="layout-shell">
    <div class="header-inner">
      <header class="site-header"></header>
    </div>

    <script>
      fetch('/fantasy-hockey/shared/header.html')
        .then(res => res.text())
        .then(html => {
          document.querySelector('.site-header').innerHTML = html;
        });
    </script>
    
    <div class="container">
      <h1>Leaderboard</h1>   
      <div id="leaderboard"></div>   
    </div>
    
    <div class="card">
      <h1>Bingo Cards</h1>

      <!-- Card selector -->
      <div class="filters">
        <label for="card-select">Select Card:</label>
        <select id="card-select">
          <option value="">Choose a card...</option>
        </select>
      </div>

      <div id="cards-container"></div>
        <h2 id="entry-name"></h2>
        <h3 id="card-number"></h3>
        <div id="bingo-grid" class="bingo-grid"></div>
      </div>
    </div>
  </div>

  <script src="/fantasy-hockey/scripts/world_cup.js" defer></script>
</body>
</html>
