<!DOCTYPE html>
<html>
<body>
<form id="poolForm">
    <label>Who is winning the Cup?</label>
    <input type="text" name="cup_winner" required>
    
    <label>Leading Scorer:</label>
    <input type="text" name="top_scorer" required>
    
    <button type="submit" id="saveBtn">Save My Picks</button>
</form>

<script>
    const form = document.getElementById('poolForm');

    // 1. Load existing data on start
    window.addEventListener('load', async () => {
        const response = await fetch('/playoff-get');
        const data = await response.json();
        if (data.cup_winner) {
            form.elements['cup_winner'].value = data.cup_winner;
            form.elements['top_scorer'].value = data.top_scorer;
        }
    });

    // 2. Submit data
    form.onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        btn.innerText = "Saving...";

        const formData = Object.fromEntries(new FormData(form));

        const response = await fetch('/playoff-submit', {
            method: 'POST',
            body: JSON.stringify(formData),
            headers: { 'Content-Type': 'application/json' }
        });

        if (response.ok) {
            alert("Roster saved to the edge!");
        } else {
            alert("Save failed. Check the console.");
        }
        btn.disabled = false;
        btn.innerText = "Save My Picks";
    };
</script>
</body>
</html>
