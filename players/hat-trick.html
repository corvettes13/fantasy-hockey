<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Top Fantasy Performers</title>
  <link rel="stylesheet" href="/fantasy-hockey/css/leaders.css" />
  <link rel="stylesheet" href="/fantasy-hockey/css/styles.css" />
  <link rel="stylesheet" href="/fantasy-hockey/css/header.css" />
  <style>
    .result-container {
      text-align: center;
      margin-top: 40px;
    }
    .yes {
      color: green;
      font-weight: bold;
      font-size: 40px;
    }
    .no {
      color: red;
      font-weight: bold;
      font-size: 40px;
    }
    .player-message {
      font-size: 24px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="layout-shell">
    <div class="header-inner">
      <header class="site-header"></header>
    </div>
    <script>
    fetch('/fantasy-hockey/shared/header.html')
      .then(res => res.text())
      .then(html => {
        document.querySelector('.site-header').innerHTML = html;
      });
    </script>

    <div class="container">
      <h1>Did Bradford Get Screwed Yesterday?</h1>
      <div id="hat-trick-result" class="result-container">Loading...</div>
    </div>
    
    <div class="container" style="margin-top: 25px;">
      <h2>Hat Tricks This Season</h2>
      <!-- Count goes here -->
      <div id="team7-count" style="font-weight: bold; margin-bottom: 10px; text-align: center;"></div>
      <div class="table-wrapper">
        <table id="hat-trick-table">
          <thead>
            <tr>
              <th>Player</th>
              <th>Date</th>
              <th>Screwed</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    
<script>
  function cleanDate(iso) {
    if (!iso) return "";
    return String(iso).trim();
  }

  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yyyy = yesterday.getFullYear();
  const mm = String(yesterday.getMonth() + 1).padStart(2, '0');
  const dd = String(yesterday.getDate()).padStart(2, '0');
  const targetDate = `${yyyy}-${mm}-${dd}`;

  fetch('/fantasy-hockey/data/2025_hat_tricks.json')
    .then(res => res.json())
    .then(data => {

      // -------------------------
      // Yesterday logic
      // -------------------------
      const resultDiv = document.getElementById('hat-trick-result');

      const match = data.find(entry => cleanDate(entry.date) === targetDate);

      if (!match) {
        resultDiv.innerHTML = `
          <div class="no">No</div>
          <div class="player-message">No Hype Machine player scored a hat trick yesterday.</div>
        `;
      } else if (match.on_team_7) {
        resultDiv.innerHTML = `
          <div class="yes">Yes</div>
          <div class="player-message">${match.player_name} scored a hat trick.</div>
        `;
      } else {
        resultDiv.innerHTML = `
          <div class="no">No</div>
          <div class="player-message">No Hype Machine player scored a hat trick yesterday.</div>
        `;
      }


      // -------------------------
      // Table logic
      // -------------------------
      const tbody = document.querySelector('#hat-trick-table tbody');
      const countDiv = document.getElementById('team7-count');

      function formatDatePretty(iso) {
        const d = new Date(cleanDate(iso));
        return d.toLocaleDateString("en-US", {
          month: "short",
          day: "numeric",
          year: "numeric"
        });
      }

      let team7Count = 0;

      data.forEach(entry => {
        const row = document.createElement('tr');

        if (entry.on_team_7) team7Count++;

        row.innerHTML = `
          <td>${entry.player_name}</td>
          <td>${formatDatePretty(entry.date)}</td>
          <td style="font-weight: ${entry.on_team_7 ? 'bold' : 'normal'}; color: ${entry.on_team_7 ? 'green' : 'inherit'};">
            ${entry.on_team_7 ? 'Yes' : 'No'}
          </td>
        `;

        tbody.appendChild(row);
      });

      countDiv.textContent = `Times Bradford Got Screwed: ${team7Count}`;
    })
    .catch(err => {
      console.error('Error loading hat trick data:', err);
      document.getElementById('hat-trick-result').textContent = 'Error loading data';
    });
</script>

    
  </div>
</body>
</html>
