<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fantasy Hockey Team Page</title>
  <link rel="stylesheet" href="../css/teams.css" />
  <link rel="stylesheet" href="../css/header.css" />
</head>
<body>
  <header class="site-header"></header>
  <script>
    fetch('../shared/header.html')
      .then(res => res.text())
      .then(html => {
        document.querySelector('.site-header').innerHTML = html;
      });
  </script>

  <div class="container">
    <!-- Team Header injected by JS -->
    <div id="team-header"></div>

    <h1>Team Roster</h1>
    <div class="table-wrapper">
        <table id="team-table" class="left-align">
          <thead>
            <tr>
              <th data-sort="player_name">Player</th>
              <th data-sort="team_abbr">Team</th>
              <th data-sort="primary_position">Pos</th>
              <th data-sort="FP">Points</th>
              <th data-sort="FPG">FP/G</th>
              <th data-sort="GP">GP</th>
              <th data-sort="G">G</th>
              <th data-sort="A">A</th>
              <th data-sort="PTS">PTS</th>
              <th data-sort="PIM">PIM</th>
              <th data-sort="SOG">SOG</th>
              <th data-sort="SPCT">S%</th>
              <th data-sort="SHG">SHG</th>
              <th data-sort="GWG">GWG</th>
              <th data-sort="BLK">BLK</th>
              <th data-sort="HIT">HIT</th>
              <th data-sort="ATOI">ATOI</th>
            </tr>
          </thead>
          <tbody id="team-body">
            <!-- Rows injected by JS -->
          </tbody>
        </table>
    </div>
    <hr>
    <div class="table-wrapper">
      <table id="goalie-table" class="left-align">
        <thead>
          <tr>
            <th>Player</th>
            <th>Team</th>
            <th>Pos</th>
            <th data-sort="FP">Points</th>
            <th data-sort="FPG">FP/G</th>
            <th data-sort="GP">GP</th>
            <th data-sort="W">W</th>
            <th data-sort="L">L</th>
            <th data-sort="GA">GA</th>
            <th data-sort="SV">SV</th>
            <th data-sort="GAA">GAA</th>
            <th data-sort="SV%">SV%</th>
            <th data-sort="SO">SO</th>
            <th data-sort="MIN">MIN</th>
          </tr>
        </thead>
        <tbody id="goalie-body">
          <!-- Goalie rows injected by JS -->
        </tbody>
      </table>
    </div>
  </div>
  <script src="../scripts/teams.js"></script>
</body>
</html>
